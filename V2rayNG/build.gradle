plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aio2ray.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.aio2ray.mobile"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // پشتیبانی از معماری‌های مختلف برای APK
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug // برای تست در گیت‌هاب (برای تولید نهایی باید کلید اختصاصی اضافه شود)
        }
        debug {
            debuggable true
        }
        // PlaystoreDebug برای ساخت APK در گیت‌هاب (طبق ساختار v2box)
        create("playstoreDebug") {
            matchingFallbacks += ['debug']
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    
    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Xray Core Library (پین شده به نسخه ۲۶.۷.۵ طبق v2box)
    implementation 'com.github.2dust:AndroidLibXrayLite:v26.7.5'
    
    // کتابخانه hev-socks5-tunnel (محلية - باید کامپایل شود)
    implementation project(':hev-socks5-tunnel')

    // تست‌ها
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// تنظیم نسخه کاتلین
ext {
    kotlin_version = '1.9.20'
}
