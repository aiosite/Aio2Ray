name: Build Aio2Ray APK

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  # اجبار استفاده از Node 24 برای جلوگیری از هشدارها
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5  # نسخه ۵ (اصلاح شده)
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            cmdline-tools;latest
            platforms;android-34
            build-tools;34.0.0
            ndk;29.0.14206865
            emulator
          accept-android-sdk-licenses: true

      - name: Build APK
        run: |
          cd V2rayNG
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865
          ./gradlew assemblePlaystoreDebug

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aio2Ray-APK
          path: V2rayNG/build/outputs/apk/playstoreDebug/*.apk
          retention-days: 30

      - name: Create Release (if tag exists)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: V2rayNG/build/outputs/apk/playstoreDebug/*.apk
          draft: false
          prerelease: false
